# eig_elbo_boed ablation config. sibling of eig_boed: the between-round belief
# update is an ELBO-optimized alpha-tempered posterior (see
# notes/eig_elbo_boed_mid_level.md), not the exact conjugate update. all output
# paths in-repo. canonical keys only.

# directories (in-repo)
data_dir: "ex/ablations/eig_elbo_boed/data"
raw_results_dir: "ex/ablations/eig_elbo_boed/raw_results"
processed_results_dir: "ex/ablations/eig_elbo_boed/processed_results"
figures_dir: "ex/ablations/eig_elbo_boed/figures"

# data generation (synthetic linear-gaussian, d=3, scalar y)
data_dim: 3
sigma2: 1.0
eig_min: 0.5
eig_max: 2.0
nsamples: 10000

# factor grid (cell = (arm, geometry, prior_idx, method, seed_rep))
num_priors: 12
n_seeds: 5
geometries: [diag, rot]
arms: [method]          # no oracle arm in v1

# design-selection channel: dre_eig (this ablation) | analytic (future elbo_boed)
design_channel: dre_eig

# sequential loop: 5 rounds. per round: design search (n_trials over xi) + alpha
# search (n_trials_alpha over the tempering).
n_rounds: 5
n_trials: 20
n_startup: 10
n_trials_alpha: 12      # 4 startup + 8 GP (alpha=1 is now an interior optimum)
n_startup_alpha: 4      # grid startup for the alpha search; nearest point snapped to alpha=1.0
alpha_lo: 0.03
alpha_hi: 3.0           # > 1 permits over-tempering -> alpha=1 is interior, not a boundary

# eigengap ladder for prior spectrum stratification (log-spaced across num_priors)
eigengap_min: 1.05
eigengap_max: 16.0

# hyperparameter winners: builder-native ELBO winners (the file the elbo experiment
# actually fits from). the gold scratch/gold_winners/winners.elbo.yaml is a friendly
# reporting summary with stale/missing keys (num_epochs, no vertex_band) that does NOT
# build -- do not use it here. this file has 19 methods incl VFMOrthros (excluded below).
winners_path: "ex/synth/elbo/winners.yaml"                 # ELBO winners -> DRE-ELBO posterior channel
# winners-per-channel: EIG-tuned winners drive the DRE-EIG design search (the design task
# is EIG estimation; ELBO winners under-train the flow methods for it -> use EIG winners).
eig_winners_path: "scratch/gold_winners/winners.eig.yaml"  # EIG winners -> DRE-EIG design channel

# dropped from this campaign (compute + gather + plots): VFMOrthros, plus the whole
# trajectory family (CTSM/TSM + triangular variants) -- their ELBO winners are
# under-trained, giving partially-degenerate posteriors (alpha pinned to alpha_lo,
# post_kl spikes; see the babysit finding). honored by enumerate_cells; excluded from
# config_hash so it does not invalidate the surviving classifier shards.
exclude_methods: [VFMOrthros, CTSM, TSM, TriangularCTSM_V1, TriangularCTSM_V2, TriangularCTSM_V3, TriangularTSM]

# reproducibility
config_seed: 1729

# node-local journal storage (expands ${TMPDIR} at runtime)
journal_scratch: "${TMPDIR}/eig_elbo_boed_journals"

# runtime
device: "cuda"
