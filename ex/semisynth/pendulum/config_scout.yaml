# SCOUT CONFIG for alpha selection
# alphas_chosen empty + extra_diag_alphas = candidate set; n_seeds_gate 1;
# flow steps 15000. replays use PRODUCTION trainer settings (reusable).
# usage: python -m ex.semisynth.pendulum.step0a_rl_runs --config ex/semisynth/pendulum/config_scout.yaml   (then step0b, step0_scout)

pendulum:
  g: 10.0                # float > 0; gravitational acceleration (m/s^2)
  ell: 1.0               # float > 0; pendulum length (m)
  m: 1.0                 # float > 0; mass (kg)
  dt: 0.05               # float > 0; integration timestep (s)
  action_clip: 2.0       # float > 0; action clip bound (N*m)
  theta_dot_clip: 8.0    # float > 0; angular velocity clip bound (rad/s)
  mu0:
    theta_bounds: [-3.141592653589793, 3.141592653589793]   # [rad, rad]; theta in [-pi, pi]
    theta_dot_bounds: [-1.0, 1.0]                            # [rad/s, rad/s]; initial ang vel
  r_E_name: "upright"      # str; exact name -> resolves to src.utils.pendulum.r_upright
  r_anti_name: "swingdown" # str; exact name -> resolves to src.utils.pendulum.r_swingdown

# === Tile-Coded Q-Function Grid ===
q_grid:
  N_theta: 128             # int > 0; tiles along theta in [-pi, pi)
  N_theta_dot: 128         # int > 0; tiles along theta_dot
  N_action: 21             # int > 0; action grid points in [-action_clip, action_clip]
  gamma: 0.99              # float in (0, 1); discount factor
  fqi_max_iter: 1000       # int > 0; fitted-q-iteration loop limit
  fqi_tol: 1.0e-4          # float > 0; bellman residual stopping tolerance
  cache_dir: ${DPE_DATA_ROOT}/pendulum_eldr_estimation/q_cache  # heavy; offloaded; hdf5 cache keyed by cfg sha256

# === Trajectory Horizon ===
trajectory:
  T: 5                     # int > 0; horizon length (T+1 timesteps total)

# === RL Behavior Source: Online Soft Q-Learning ===
rl_runs:
  alphas_chosen: []        # SCOUT config: final strata not chosen yet; iterate via extra_diag_alphas
  extra_diag_alphas: [1.0e-2, 2.0e-2, 4.0e-2, 8.0e-2, 1.6e-1, 3.2e-1, 4.0e-1, 4.8e-1, 5.6e-1, 6.4e-1, 7.2e-1, 8.0e-1, 8.8e-1, 9.6e-1]  # iter2: dense probe of the 0.32-0.96 transition (below 0.32 is noise floor); note: yaml 1.1 scientific notation
  n_seeds_gate: 1          # SCOUT: single seed (production: 3)          # int > 0; training seeds for flow stability check (G4)
  trainer:
    n_steps: 200000        # int > 0; soft-Q trainer loop limit
    lr: 0.05               # float > 0; adam learning rate
    minibatch: 32          # int > 0; minibatch size from replay buffer
    td_update_freq: 1      # int > 0; td update frequency
    beta_init: 0.3         # float > 0; inverse temperature at start
    beta_final: 10.0       # float > 0; inverse temperature at end
    beta_schedule: linear  # str; temperature annealing schedule
    episode_len: 200       # int > 0; episode length (reset from mu0)
    warmup: 1000           # int > 0; steps before replay starts
    stream_target: 500000  # int > 0; target replay stream size (stratified subsample)
  cache_dir: ${DPE_DATA_ROOT}/pendulum_eldr_estimation/rl_replay  # heavy; offloaded; deterministic by seed

# === Ground Truth: Bounded-Support 1-D RQ-Spline Flows ===
flow:
  hidden_dim: 128          # int > 0; hypernet hidden dimension
  n_layers: 3              # int > 0; rational-quadratic spline layers
  n_bins: 32               # int > 0; spline bin count
  train:
    steps: 15000           # SCOUT scale (production: 100000); content-addressed ckpts never collide with production          # int > 0; mle training loop limit
    batch: 1024            # int > 0; minibatch size
    lr: 1.0e-3             # float > 0; adam learning rate
    weight_decay: 1.0e-4   # float > 0; l2 regularization
    ema_decay: 0.9999      # float in (0, 1); exponential moving average
    heldout_frac: 0.2      # float in (0, 1); validation holdout
    warmup_frac: 0.05      # float in (0, 1); warmup fraction of steps
  ckpt_dir: ${DPE_DATA_ROOT}/pendulum_eldr_estimation/flow_ckpt  # heavy; offloaded; keyed by replay+arch hash

# === Oracle-Free Acceptance Gate ===
gate:
  out_dir: ${DPE_DATA_ROOT}/pendulum_eldr_estimation/gate_reports  # content-addressed json reports (G1-G4 checks)
  # thresholds (pre-registered) are frozen in ex/utils/flow_gate.py, not config:
  # G1 ks_alpha=0.05, pit_max_bin=0.15; G2 nll_gap=0.2 nats; G4 seed_cv=0.15
  # (pre-registration ensures non-tunability for reproducibility)

# === Difficulty Labels: Realized K1 Measurement (step0d) ===
alpha_selection:
  separation_mult: 2.0     # float > 0; ADVISORY: warn if neighboring realized K1 differ by < 2x combined SE (pilot gate remains the campaign guard)
  M: 500                   # int > 0; mc rollouts for realized K1 estimation

# === Campaign Hyperparameters ===
campaign:
  beta: 0.5                # float in (0, 1); mixture weight for pstar = (1-beta)*pi_O + beta*pi_E
  seeds_default: 100       # int > 0; peak seeds per (k1, stratum) cell (24 train + 8 holdout + 68 step2)

# === Sampling and Runtime ===
num_samples: 5000          # int > 0; trajectory triplets per (stratum, seed) cell
device: cpu                # str; "cpu" only (datagen is numpy end-to-end)
seed: 1729                 # int; global reproducibility seed

# === Algorithms (List + Waypoints) ===
algorithms:
  - BDRE
  - MDRE
  - MultiHeadTDRE
  - MultiHeadTriangularTDRE
  - TriangularMDRE
  - TSM
  - TriangularTSM
  - CTSM
  - TriangularCTSM_V1
  - TriangularCTSM_V2
  - TriangularCTSM_V3
  - VFM
  - TriangularVFM_V1
  - TriangularVFM_V2
  - TriangularVFM_V3
  - FMDRE
  - FMDRE_S2
  - TriangularFMDRE
num_waypoints: 15          # int >= 3; linear interpolation schedule for triangular methods

# === Directory Paths ===
data_dir: ${DPE_DATA_ROOT}/pendulum_eldr_estimation/data_rl_v1  # version-pinned (gaussian-era data strictly separated)
raw_results_dir: /data/user_data/aviamala/dpe-submission/step2_results/pendulum/raw_results
processed_results_dir: ex/semisynth/pendulum/processed_results
figures_dir: ex/semisynth/pendulum/figures
